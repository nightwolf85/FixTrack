version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fixtrack_db
    environment:
      POSTGRES_DB: fixtrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: